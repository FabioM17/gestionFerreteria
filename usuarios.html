<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios | Ferretería El Tornillo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<!--
  usuarios.html - Módulo de usuarios del sistema (empleados)
  La lógica está en js/usuarios.js. No cambies los id: el JavaScript los usa.
-->
<body class="verificando">
  <div class="app">

    <!-- Menú lateral: lo dibuja menu.js -->
    <aside id="menuLateral" class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" aria-label="Menú"></aside>

    <div class="contenido">
      <!-- Barra superior: la dibuja menu.js -->
      <header id="barraSuperior" class="barra-superior"></header>

      <main class="p-3 p-lg-4">
        <section class="panel">

          <div class="panel-encabezado">
            <p id="contador" class="mb-0 text-secondary"></p>
            <button id="botonNuevoUsuario" class="btn btn-ferre" type="button">
              <i class="bi bi-person-plus" aria-hidden="true"></i> Nuevo usuario
            </button>
          </div>

          <!-- Lista de usuarios (las filas las dibuja usuarios.js) -->
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th scope="col">Empleado</th>
                  <th scope="col">Correo</th>
                  <th scope="col">Rol</th>
                </tr>
              </thead>
              <tbody id="tablaUsuarios"></tbody>
            </table>
          </div>

        </section>
      </main>
    </div>

  </div>

  <!-- Ventana: nuevo usuario  -->
  <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="tituloModalUsuario" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <form id="formUsuario" class="modal-content" novalidate>

        <div class="modal-header">
          <h2 id="tituloModalUsuario" class="modal-title h4">Nuevo usuario</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" data-bs-target="#modalUsuario" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <div id="alertaUsuario" class="alert alert-danger d-none" role="alert"></div>

          <div class="row g-3">
            <div class="col-12">
              <label for="nombreEmpleado" class="form-label">Nombre del empleado</label>
              <input type="text" id="nombreEmpleado" class="form-control" maxlength="60" autocomplete="off">
              <div id="error-nombreEmpleado" class="invalid-feedback"></div>
            </div>

            <div class="col-12">
              <label for="correoEmpleado" class="form-label">Correo electrónico</label>
              <input type="email" id="correoEmpleado" class="form-control" maxlength="80" autocomplete="off">
              <div class="form-text">Con este correo iniciará sesión.</div>
              <div id="error-correoEmpleado" class="invalid-feedback"></div>
            </div>

            <div class="col-12">
              <label for="rolEmpleado" class="form-label">Rol</label>
              <select id="rolEmpleado" class="form-select">
                <option value="Cajero">Cajero: vende, registra clientes y consulta productos</option>
                <option value="Administrador">Administrador: acceso completo</option>
              </select>
              <div id="error-rolEmpleado" class="invalid-feedback"></div>
            </div>

            <div class="col-sm-6">
              <label for="claveEmpleado" class="form-label">Contraseña</label>
              <input type="password" id="claveEmpleado" class="form-control" maxlength="72" autocomplete="new-password">
              <div class="form-text">Mínimo 8 caracteres, con letras y números.</div>
              <div id="error-claveEmpleado" class="invalid-feedback"></div>
            </div>

            <div class="col-sm-6">
              <label for="confirmarClave" class="form-label">Repite la contraseña</label>
              <input type="password" id="confirmarClave" class="form-control" maxlength="72" autocomplete="new-password">
              <div id="error-confirmarClave" class="invalid-feedback"></div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-bs-target="#modalUsuario">Cancelar</button>
          <button type="submit" id="botonGuardarUsuario" class="btn btn-ferre">Crear usuario</button>
        </div>

      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
