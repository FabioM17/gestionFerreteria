<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos | Ferretería El Tornillo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>

<body class="verificando">
    <div class="app">

        <aside id="menuLateral" class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" aria-label="Menú"></aside>

        <div class="contenido">
            <header id="barraSuperior" class="barra-superior"></header>

            <main class="p-3 p-lg-4">
                <section class="panel">

                    <div class="panel-encabezado">
                        <p id="contador" class="mb-0 text-secondary"></p>
                        <!-- Oculto (d-none) hasta confirmar que el usuario es administrador -->
                        <button id="botonNuevo" class="btn btn-ferre d-none" type="button">
                            <i class="bi bi-plus-lg" aria-hidden="true"></i> Nuevo producto
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table id="tablaInventario" class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th scope="col"><span class="visually-hidden">Imagen</span></th>
                                    <th scope="col">Código</th>
                                    <th scope="col">Producto</th>
                                    <th scope="col">Categoría</th>
                                    <th scope="col" class="text-end">Precio</th>
                                    <th scope="col" class="text-end">Stock</th>
                                    <th scope="col">Estado</th>
                                    <th scope="col" class="text-end acciones-admin">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductos"></tbody>
                        </table>
                    </div>

                </section>
            </main>
        </div>

    </div>

    <!-- Ventana agrega / editar producto-->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <form id="formProducto" class="modal-content" novalidate>

                <div class="modal-header">
                    <h2 id="tituloModal" class="modal-title h4">Nuevo producto</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" data-bs-target="#modalProducto"
                        aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <!-- Errores que vienen de Supabase (no de un campo en particular) -->
                    <div id="alertaFormulario" class="alert alert-danger d-none" role="alert"></div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select id="categoria" class="form-select">
                                <option value="">Elige una categoría</option>
                            </select>
                            <div id="error-categoria" class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="codigo" class="form-label">Código</label>
                            <input type="text" id="codigo" class="form-control text-uppercase" maxlength="7"
                                placeholder="HER-009">
                            <div class="form-text">Se sugiere al elegir la categoría.</div>
                            <div id="error-codigo" class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-8">
                            <label for="nombre" class="form-label">Nombre del producto</label>
                            <input type="text" id="nombre" class="form-control" maxlength="80">
                            <div id="error-nombre" class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="marca" class="form-label">Marca</label>
                            <input type="text" id="marca" class="form-control" maxlength="40" list="listaMarcas">
                            <!-- Sugerencias de marcas ya registradas -->
                            <datalist id="listaMarcas"></datalist>
                            <div id="error-marca" class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="unidad" class="form-label">Unidad de venta</label>
                            <select id="unidad" class="form-select">
                                <option value="">Elige la unidad</option>
                            </select>
                            <div id="error-unidad" class="invalid-feedback"></div>
                        </div>

                        <div class="col-6 col-md-4">
                            <label for="costo" class="form-label">Costo ($)</label>
                            <input type="number" id="costo" class="form-control" min="0" step="0.01"
                                inputmode="decimal">
                            <div id="error-costo" class="invalid-feedback"></div>
                        </div>

                        <div class="col-6 col-md-4">
                            <label for="precio" class="form-label">Precio de venta ($)</label>
                            <input type="number" id="precio" class="form-control" min="0" step="0.01"
                                inputmode="decimal">
                            <div id="error-precio" class="invalid-feedback"></div>
                        </div>

                        <div class="col-6 col-md-4">
                            <label for="stock" class="form-label">Stock actual</label>
                            <input type="number" id="stock" class="form-control" min="0" step="1" inputmode="numeric">
                            <div id="error-stock" class="invalid-feedback"></div>
                        </div>

                        <div class="col-6 col-md-4">
                            <label for="stockMinimo" class="form-label">Stock mínimo</label>
                            <input type="number" id="stockMinimo" class="form-control" min="0" step="1"
                                inputmode="numeric">
                            <div id="error-stockMinimo" class="invalid-feedback"></div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"
                        data-bs-target="#modalProducto">Cancelar</button>
                    <button type="submit" id="botonGuardar" class="btn btn-ferre">Guardar producto</button>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="js/productos.js"></script>
</body>

</html>
