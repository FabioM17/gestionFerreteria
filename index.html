<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Ferretería El Tornillo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>

<body class="pagina-login">
    <main class="login-contenedor">
        <div class="login-tarjeta">
            <div class="franja"></div>

            <div class="p-4 p-sm-5">
                <!-- Logo -->

                <div class="marca-login">
                    <span class="marca-icono"><i class="bi bi-tools" aria-hidden="true"></i></span>
                    <span>
                        <span class="marca-nombre">El Tornillo</span>
                        <span class="marca-sub">Gestión de ferretería</span>
                    </span>
                </div>

                <h1 class="h3 mt-4 mb-1">Iniciar sesión</h1>
                <p class="text-secondary mb-4">Ingresa tus credenciales para acceder al sistema.</p>

                <!-- Mensaje de error -->
                <div id="alertaLogin" class="alert alert-danger d-none" role="alert"></div>

                <form id="formLogin" novalidate>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo" autocomplete="username" required>
                    </div>

                    <div class="mb-4">
                        <label for="clave" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="clave" class="form-control" autocomplete="current-password"
                                required>
                            <button type="button" class="btn btn-outline-secondary" id="verClave"
                                aria-label="Mostrar contraseña">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="botonEntrar" class="btn btn-ferre w-100 py-2">Iniciar sesión</button>
                </form>

                <div class="datos-prueba mt-4">
                    <div class="fw-semibold mb-1">Usuario de prueba</div>
                    <div>Administrador: admin@eltornillo.com / admin123</div>
                    <div>Cajero: cajero@eltornillo.com / cajero123</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Librería de Supabase (crea el objeto global "supabase") -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
