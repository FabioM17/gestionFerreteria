<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ventas | Ferretería El Tornillo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<!--
  ventas.html - Módulo de ventas (punto de venta)
  Requerimientos: 5 (venta), 6 (descuentos), 7 (IVA), 8 (factura), 9 (varias ventas seguidas)
  La lógica está en js/ventas.js. No cambies los id: el JavaScript los usa.
-->
<body class="verificando">
<div class="app">

    <!-- Menú lateral: lo dibuja menu.js -->
    <aside id="menuLateral" class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" aria-label="Menú"></aside>

    <div class="contenido">
        <!-- Barra superior: la dibuja menu.js -->
        <header id="barraSuperior" class="barra-superior"></header>

        <main class="p-3 p-lg-4">
            <div class="row g-3 align-items-start">

                <!-- ========== CATÁLOGO (izquierda) ========== -->
                <div class="col-lg-8">
                    <section class="panel">
                        <div class="p-3 border-bottom">
                            <label for="buscarProducto" class="visually-hidden">Buscar producto</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
                                <input type="search" id="buscarProducto" class="form-control"
                                       placeholder="Buscar por nombre, código o marca" autocomplete="off">
                            </div>

                            <!-- Botones de categorías (los dibuja ventas.js) -->
                            <div id="filtroCategorias" class="filtro-categorias mt-3" role="group" aria-label="Filtrar por categoría"></div>
                        </div>

                        <div class="p-3">
                            <p id="resultadosCatalogo" class="text-secondary small mb-3"></p>
                            <!-- Tarjetas de productos (las dibuja ventas.js) -->
                            <div id="catalogo" class="row g-3"></div>
                        </div>
                    </section>
                </div>

                <!-- ========== VENTA ACTUAL (derecha) ========== -->
                <div class="col-lg-4">
                    <section class="panel venta-actual">
                        <div class="panel-encabezado">
                            <h2 class="h5 mb-0">Venta actual</h2>
                            <span id="conteoArticulos" class="small text-secondary">0 artículos</span>
                        </div>

                        <div class="p-3 border-bottom">
                            <label for="clienteVenta" class="form-label">Cliente</label>
                            <select id="clienteVenta" class="form-select"></select>
                        </div>

                        <!-- Productos agregados (los dibuja ventas.js) -->
                        <ul id="carrito" class="list-unstyled mb-0 carrito"></ul>

                        <div class="p-3 border-top totales">
                            <div class="d-flex justify-content-between">
                                <span>Subtotal</span>
                                <span id="totalSubtotal">$0.00</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span>Descuento <small id="detalleDescuento" class="text-secondary"></small></span>
                                <span id="totalDescuento">-$0.00</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span>IVA (13 %)</span>
                                <span id="totalIva">$0.00</span>
                            </div>
                            <div class="d-flex justify-content-between total">
                                <span>Total</span>
                                <span id="totalPagar">$0.00</span>
                            </div>
                        </div>

                        <div class="p-3 pt-0 d-grid gap-2">
                            <div id="alertaVenta" class="alert alert-danger d-none mb-0" role="alert"></div>
                            <button id="botonRegistrarVenta" class="btn btn-ferre py-2" type="button" disabled>
                                <i class="bi bi-receipt" aria-hidden="true"></i> Registrar venta
                            </button>
                            <button id="botonVaciar" class="btn btn-outline-secondary" type="button" disabled>Vaciar venta</button>
                        </div>
                    </section>
                </div>

            </div>
        </main>
    </div>

</div>

<!-- ========== VENTANA: factura ========== -->
<!-- data-bs-backdrop="static": no se cierra al tocar fuera, para no perder la factura por accidente -->
<div class="modal fade" id="modalFactura" tabindex="-1" aria-labelledby="tituloFactura" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <h2 id="tituloFactura" class="modal-title h4">Venta registrada</h2>
            </div>

            <!-- Contenido de la factura (lo dibuja ventas.js) -->
            <div class="modal-body">
                <div id="factura" class="factura"></div>
            </div>

            <div class="modal-footer">
                <button id="botonImprimir" type="button" class="btn btn-outline-secondary">
                    <i class="bi bi-printer" aria-hidden="true"></i> Imprimir
                </button>
                <button id="botonNuevaVenta" type="button" class="btn btn-ferre">Nueva venta</button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/menu.js"></script>
<script src="js/utilidades.js"></script>
<script src="js/ventas.js"></script>
</body>
</html>
